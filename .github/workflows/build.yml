name: Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'android'
        type: choice
        options:
          - android
          - windows
          - macos
          - linux

jobs:
  build-android:
    if: ${{ github.event.inputs.platform == 'android' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: go.sum

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.x'
          channel: 'stable'
          cache: true

      - name: Locate Android NDK and SDK
        run: |
          ANDROID_SDK=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=${ANDROID_SDK}" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK}" >> $GITHUB_ENV
          # Find the latest installed NDK version
          NDK_DIR=$(ls -d ${ANDROID_SDK}/ndk/* 2>/dev/null | sort -V | tail -1)
          if [ -z "$NDK_DIR" ]; then
            echo "No NDK found, installing..."
            ${ANDROID_SDK}/cmdline-tools/latest/bin/sdkmanager "ndk;27.2.12479018" --sdk_root=${ANDROID_SDK}
            NDK_DIR="${ANDROID_SDK}/ndk/27.2.12479018"
          fi
          echo "Found NDK: $NDK_DIR"
          echo "ANDROID_NDK_HOME=${NDK_DIR}" >> $GITHUB_ENV
          echo "NDK_HOME=${NDK_DIR}" >> $GITHUB_ENV

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init

      - name: Build Android AAR (libgopeed)
        run: |
          mkdir -p ui/flutter/android/app/libs
          gomobile bind \
            -target=android \
            -androidapi=21 \
            -v \
            -o ui/flutter/android/app/libs/libgopeed.aar \
            github.com/GopeedLab/gopeed/bind/mobile

      - name: Decode keystore
        env:
          APK_KEYSTORE: ${{ secrets.APK_KEYSTORE }}
        run: |
          echo "$APK_KEYSTORE" | base64 -d > ui/flutter/android/app/upload-keystore.jks

      - name: Build APK (split per ABI)
        env:
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
          APK_STORE_PASSWORD: ${{ secrets.APK_STORE_PASSWORD }}
        run: |
          cd ui/flutter
          flutter pub get
          flutter build apk --release --split-per-abi

      - name: Build Universal APK
        env:
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
          APK_STORE_PASSWORD: ${{ secrets.APK_STORE_PASSWORD }}
        run: |
          cd ui/flutter
          flutter build apk --release

      - name: Upload APKs to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          files: |
            ui/flutter/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            ui/flutter/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            ui/flutter/build/app/outputs/flutter-apk/app-x86_64-release.apk
            ui/flutter/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
